<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SLPRAXO · Le Passe — Studio Cuisine V5</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 45% 20%,#fffdfb,#e8e7e4 69%,#d8d5d0);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#292a2b}canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}header{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:19px 22px;pointer-events:none}header strong{letter-spacing:.15em;font-size:18px}header strong span{color:#b8735c}header small{background:#ffffffab;border:1px solid #ffffff;padding:10px 14px;border-radius:40px;color:#5f5b57;font-size:10px;letter-spacing:.1em}.bar{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);border-radius:20px;background:#ffffffcf;border:1px solid white;box-shadow:0 12px 36px #55555522;display:flex;align-items:center;gap:12px;padding:10px 12px;backdrop-filter:blur(14px);max-width:calc(100vw - 20px)}button{background:#262a2d;border:0;color:white;padding:13px 17px;border-radius:12px;font-weight:650;cursor:pointer;white-space:nowrap}button.secondary{background:#e9e7e2;color:#292a2b}.bar span{font-size:12px;color:#5c5b57;white-space:nowrap}#error{display:none;position:fixed;inset:0;align-items:center;justify-content:center;background:#eee8e3;padding:30px;text-align:center}#error div{max-width:430px;line-height:1.6}@media(max-width:620px){header{padding:16px}header strong{font-size:16px}header small{font-size:9px}.bar{bottom:14px;gap:5px}.bar span{display:none}button{font-size:12px;padding:12px 13px}}</style>
</head><body><canvas id="view"></canvas><header><strong>SLPRAXO<span>.</span></strong><small>LE PASSE / STUDIO CUISINE</small></header><div class="bar"><span>Glisser pour explorer · Pincer pour zoomer</span><button class="secondary" id="front">Vue service</button><button id="orbit">Vue 3D</button></div><div id="error"><div><h2>Chargement impossible</h2><p>Cette scène utilise un modèle GLB indépendant. Ouvre le site sur son adresse GitHub Pages HTTPS, avec le fichier <code>slpraxo_cuisine_v5.glb</code> au même niveau que <code>index.html</code>.</p></div></div>
<script src="https://cdn.babylonjs.com/babylon.js"></script><script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script><script>
(async function(){const err=()=>document.getElementById('error').style.display='flex';if(!window.BABYLON){err();return}const canvas=document.getElementById('view');const engine=new BABYLON.Engine(canvas,true,{antialias:true,adaptToDeviceRatio:true});engine.setHardwareScalingLevel(Math.max(1,Math.min(1.7,window.devicePixelRatio/1.7)));const scene=new BABYLON.Scene(engine);scene.clearColor=new BABYLON.Color4(0,0,0,0);scene.imageProcessingConfiguration.toneMappingEnabled=true;scene.imageProcessingConfiguration.toneMappingType=BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;scene.imageProcessingConfiguration.exposure=1.15;scene.imageProcessingConfiguration.contrast=1.12;
const camera=new BABYLON.ArcRotateCamera('cam',-Math.PI*.65,1.08,12.4,new BABYLON.Vector3(0,1.6,.2),scene);camera.lowerRadiusLimit=7.2;camera.upperRadiusLimit=22;camera.lowerBetaLimit=.57;camera.upperBetaLimit=1.55;camera.panningSensibility=0;camera.wheelPrecision=55;camera.pinchPrecision=85;camera.inertia=.75;camera.attachControl(canvas,true);
const hemi=new BABYLON.HemisphericLight('studio',new BABYLON.Vector3(.2,1,-.3),scene);hemi.intensity=1.3;hemi.groundColor=new BABYLON.Color3(.56,.57,.59);
const key=new BABYLON.DirectionalLight('soft key',new BABYLON.Vector3(-.55,-1,.48),scene);key.position=new BABYLON.Vector3(3,10,-8);key.intensity=2.0;
const fill=new BABYLON.DirectionalLight('rim',new BABYLON.Vector3(.55,-.48,-.75),scene);fill.intensity=.7;
try{await BABYLON.SceneLoader.AppendAsync('./','slpraxo_cuisine_v5.glb',scene);document.getElementById('front').onclick=()=>{camera.setTarget(new BABYLON.Vector3(0,1.65,1.3));camera.alpha=-Math.PI/2;camera.beta=1.15;camera.radius=10.8};document.getElementById('orbit').onclick=()=>{camera.setTarget(new BABYLON.Vector3(0,1.7,.2));camera.alpha=-Math.PI*.65;camera.beta=1.08;camera.radius=12.4}}catch(e){console.error('GLB',e);err()}
engine.runRenderLoop(()=>scene.render());addEventListener('resize',()=>engine.resize());})();
</script></body></html>
